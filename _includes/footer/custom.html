<div class="footer-author-profile" style="margin-bottom: 1.5rem; text-align: center;">
  <img src="{{ site.author.avatar }}" alt="pyromed logo" style="max-width: 90px; border-radius: 50%; display: block; margin: 0 auto 0.5rem auto;">
  <p style="font-size: 0.9em; color: #666; margin-bottom: 0.5rem;">{{ site.author.bio }}</p>
  <div class="footer-author-links" style="font-size: 0.9em;">
    {% for link in site.author.links %}
      <a href="{{ link.url }}" style="margin: 0 8px; text-decoration: none;">
        <i class="{{ link.icon }}"></i> {{ link.label }}
      </a>
    {% endfor %}
  </div>
</div>
